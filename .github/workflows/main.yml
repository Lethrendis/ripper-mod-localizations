name: Build Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example 1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.event.release.tag_name }}

    # Substitute the Manifest and Download URLs in the module.json
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      uses: microsoft/variable-substitution@v1
      with:
        files: 'module.json'
      env:
        version: ${{ inputs.tag || github.event.release.tag_name }}
        url: https://github.com/${{ github.repository }}
        manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
        download: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.event.release.tag_name }}/module.zip

    # Merge the per-module files in translations/ into the languages/ folder that
    # ships with the module (translations/<module-id>/<lang>.json -> languages/<lang>.json)
    - name: Merge Translations Into Languages
      run: python3 merge_translations.py

    # Create a zip file with all files required by the module to add to the release
    - run: zip -r ./module.zip module.json index.js index.js.map LICENSE styles/ templates/ languages/

    # Attach the manifest and the zip to the release, which already exists: either
    # published by hand or created by the Cut Release workflow.
    - name: Attach the release files
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$TAG" module.json module.zip --clobber
